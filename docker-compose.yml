services:
  oceanview:
    build: .
    image: pointroberts-oceanview:latest
    container_name: oceanview
    restart: unless-stopped
    environment:
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      # Guards /admin/visitors. Unset means that page returns 503, not that it
      # opens.
      OCEANVIEW_ADMIN_PASSWORD: ${OCEANVIEW_ADMIN_PASSWORD:-}
    # 8091, not 8090: the Basement server already runs yarbo-emulator-timefold
    # on 8090, and nginx proxies oceanview.johnpoole.ca here.
    ports:
      - "8091:8080"
    # What survives a redeploy. Two things live in here now: the ship lookups,
    # because what a ship is does not change, and the visitor record, because a
    # deploy forgetting who has been is the whole reason it is on disk. The
    # volume keeps its old name — renaming it would orphan the ships already in
    # it — so read the mount point rather than the name.
    volumes:
      - shipfinder-ships:/app/data

volumes:
  shipfinder-ships:
